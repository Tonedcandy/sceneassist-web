<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>404 - Page not found | SceneAssist™</title>
    <meta name="robots" content="noindex" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            /* tweak once, reuse everywhere (HSL components) */
            --top: 220 45% 7%;
            /* very dark navy */
            --mid: 220 50% 19%;
            /* slate-ish */
            --bot: 222 74% 82%;
            /* brand light blue */
        }

        html,
        body {
            height: 100%;
            min-height: 100%;
        }

        /* Full-page, layered background on the ROOT */
        html {
            min-height: 100dvh;
            background:
                /* soft vignette at the very top for logo readability */
                radial-gradient(1200px 600px at 50% -240px, hsl(var(--top) / .85) 0%, transparent 60%),
                /* long, seamless vertical fade */
                linear-gradient(to bottom,
                    hsl(var(--top)) 0%,
                    hsl(var(--top)) clamp(50px, 10dvh, 400px),
                    hsl(var(--mid)) clamp(400px, 100dvh, 1000px),
                    hsl(var(--bot)) clamp(1000px, 150dvh, 2000px));
            background-repeat: no-repeat, no-repeat;
            background-size: 100% 100%, 100% 100%;
        }
    </style>
</head>

<body class="min-h-screen bg-transparent text-slate-200"><!-- NOTE: bg-transparent -->
    <main class="flex min-h-screen flex-col">
        <section class="w-full flex-1">
            <div class="mx-auto w-full max-w-[1200px] px-4 sm:px-6 lg:px-8 py-16 sm:py-20">
                <div class="max-w-[640px] mx-auto text-center">
                    <img src="./sceneassist-wordmark.png" alt="SceneAssist" class="mx-auto mb-6 h-10 w-auto" />
                    <h1 class="font-light leading-tight text-slate-200/90"
                        style="font-size: clamp(2rem, 4vw + 0.5rem, 5rem);">404</h1>
                    <h1 class="font-black leading-tight text-slate-200/90 drop-shadow-sm"
                        style="font-size: clamp(2rem, 2.4vw + 0.5rem, 3rem);">
                        Page not found
                    </h1>
                    <p class="mt-3 text-slate-200/90">
                        The page you’re looking for doesn’t exist or has moved.
                    </p>
                    <div class="mt-6 flex flex-wrap items-center justify-center gap-3">
                        <a href="/"
                            class="inline-flex items-center rounded-xl hover:bg-black hover:text-[#FFD445] text-black px-4 py-2.5 text-sm font-semibold bg-[#FFD445]">
                            Go home
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
